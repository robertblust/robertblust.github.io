name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two ways to hang this job in the server step are already documented in CLAUDE.md and
    # both were hit for real in the sibling repositories. A third would otherwise burn the
    # 360-minute default before anyone learned it existed, on a check destined to be required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # First, because it needs nothing installed and it catches the one failure the browser
      # cannot see: a note edited without regenerating its clip renders perfectly and speaks
      # the old words. --dry-run bills nothing and needs no key.
      - name: Clips still say what the notes say
        run: |
          out=$(./tts/generate.py --dry-run)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'would write'; then
            echo "::error::narration is stale — run ./tts/generate.py and commit the clips"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # Before npm ci because it installs nothing: the duplication sweep decides what counts as
      # duplication by deciding which lines the package owns. It has been wrong about that three
      # times, and each time the wrong answer looked like a clean result. This runs its own
      # tests; it does not run the sweep, which needs all three checkouts side by side and so
      # only works on a developer's machine.
      - name: The duplication sweep still knows what the package owns
        run: npm run test:dupes
      # The principles page is generated from the model, so a page edited by hand — or a model
      # that moved without the page being rebuilt — is a drift this catches before it ships.
      # Reads the pinned commit over the API; the token is only for the rate limit.
      - name: The principles page still matches the model
        run: npm run principles:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      # How far the model pin has fallen behind what it points at. Non-blocking on purpose:
      # the pin is editorial — it says which state of the model these pages publish — so a pin
      # behind its upstream is either deliberate or waiting to be looked at, and no script can
      # tell those apart. It reports and passes; a red check here would be ignored by the
      # second week. The token is only for the rate limit.
      - name: How far the model pin has fallen behind
        run: npm run pin:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After npm ci because it needs the package; before the browser because a file that is
      # not what the package ships should fail on the cheap step, not on a rendered page.
      - name: The shared files are still what the package ships
        run: npm run design:check
      # The card harness now arrives from the package, so these two can no longer run before
      # npm ci — left above it they fail every push with ERR_MODULE_NOT_FOUND. They still need
      # no browser, which is the property worth keeping: og:check renders no page, it
      # re-derives each card's recipe hash and compares. So they sit here, after npm ci and
      # before playwright install.
      - name: The card check still works
        run: npm run test:og
      - name: Cards still show the page they render
        run: npm run og:check
      # The model page is generated from the model, exactly as the principles page is — but it
      # cannot sit beside its sibling above, because build/model.mjs now imports the parser
      # from companygraph-meta-model and that is not on disk until npm ci has run. Left up
      # there it would fail every push with ERR_MODULE_NOT_FOUND, and a local run cannot catch
      # that, because node_modules is already on the machine. Until now neither this check nor
      # the parser's tests ran here at all, so the one page this site builds from an external
      # model was the one page CI never looked at.
      - name: The model page still matches the model
        run: npm run model:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: python3 -m http.server 8000 > /dev/null 2>&1 &
      - name: Wait for the server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "Server never came up on :8000" >&2
          exit 1
      - name: Assert what it renders
        run: npm run verify
