name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two ways to hang this job in the server step are already documented in CLAUDE.md and
    # both were hit for real in the sibling repositories. A third would otherwise burn the
    # 360-minute default before anyone learned it existed, on a check destined to be required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # First, because it needs nothing installed and it catches the one failure the browser
      # cannot see: a note edited without regenerating its clip renders perfectly and speaks
      # the old words. --dry-run bills nothing and needs no key.
      - name: Clips still say what the notes say
        run: |
          out=$(./tts/generate.py --dry-run)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'would write'; then
            echo "::error::narration is stale — run ./tts/generate.py and commit the clips"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # After setup-node for a known node, before npm ci because it installs nothing: the
      # check renders no page, it re-derives each card's recipe hash and compares.
      - name: Cards still show the page they render
        run: npm run og:check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: python3 -m http.server 8000 > /dev/null 2>&1 &
      - name: Wait for the server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "Server never came up on :8000" >&2
          exit 1
      - name: Assert what it renders
        run: npm run verify
