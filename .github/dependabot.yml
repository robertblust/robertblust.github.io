# Every npm dependency here is a devDependency — playwright and pdf-lib drive `npm run
# verify`, `npm run og` and `npm run pdf`. None of it reaches a visitor: the pages are
# self-contained and ship no external assets. So this file is not a vulnerability
# response, it is the thing that stops the toolchain bit-rotting until CI breaks on a
# Playwright too old for the Chromium it installs.
#
# The shape is copied from guestgraph/engine, deliberately — the same duplication the
# design tokens and the deck footer have, and the same absence of a tripwire. Grouping
# minor and patch means a quiet week is one pull request, not five; a major arrives on
# its own, which is when it deserves reading.
#
# Each PR is gated by the real check: ci.yml runs `npm run verify` on pull_request, so a
# bump that breaks what the pages render fails before it can be merged. package.json is
# named by no page, so the share-card recipe never sees these commits and `og:check`
# stays quiet.
version: 2
updates:
  # One package.json at the root — the decks under talks/ share it, unlike the two
  # sibling sites, which carry a second one per talk.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Declared first on purpose: Dependabot puts a dependency in the FIRST group it matches,
      # so naming the design package here keeps it out of minor-and-patch below. A design
      # release is a minor by the package's own semver policy, so without this it would arrive
      # bundled with a Playwright or pdf-lib bump — and this is the one pull request that has
      # to be read rather than merged on sight: it goes red until someone runs `npm run design`
      # and commits what changed.
      design:
        patterns:
          - "@robertblust/design"
      # Same reason as design above, and the same requirement to be read: a meta-model
      # release can change how `build/model.mjs` reads the model, so the pull request that
      # bumps it is the one that has to be checked against the page it draws. It also comes
      # by tag rather than by version range, which Dependabot reads only because the pin is
      # a tag — a commit SHA here would be invisible to it entirely.
      #
      # A pull request from this group proposing a LOWER version is closed, never merged. That
      # happened three times on 2026-09-02 — v0.5.0 down to v0.4.1, a commit predating the
      # instance parser, so it has no lib/ and the import fails. CI caught it every time. The
      # cause is Dependabot's release cooldown, not its tag ranking: it dates each git tag by
      # that tag's GitHub Release and filters out anything released within three days.
      # meta-model had a Release for v0.5.0 alone, so the newest tag was excluded as too fresh
      # while the older tags, carrying no Release and therefore no date to filter on, all
      # survived — leaving v0.4.1 the best of the remainder. It stops once a release ages past
      # the cooldown, and does not recur while every recent tag carries one.
      meta-model:
        patterns:
          - "companygraph-meta-model"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
